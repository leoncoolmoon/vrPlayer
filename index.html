<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>180 SBS VR Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }

  #toolbar {
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    z-index: 100;
    font-size: 12px; color: #eee;
    transition: transform .25s ease, opacity .25s ease;
  }
  #toolbar.hidden { transform: translateY(-110%); opacity: 0; pointer-events: none; }

  /* 3D 模式：工具栏/提示各复制一份，分别居中在左右半屏，方便透过眼镜重叠融合 */
  #toolbarMirror {
    position: absolute; top: 0; left: 50%; width: 50%;
    display: none; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    z-index: 100;
    font-size: 12px; color: #eee;
    pointer-events: none;   /* 只是镜像显示，点击一律走左边真正的工具栏 */
  }
  body.sbs-ui-split #toolbar { width: 50%; }
  body.sbs-ui-split #toolbarMirror { display: flex; }

  #messageMirror {
    position: absolute; bottom: 14px; left: 75%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.65);
    padding: 6px 14px; border-radius: 6px;
    font-size: 12px; z-index: 50; white-space: nowrap;
    display: none; pointer-events: none;
  }
  body.sbs-ui-split #message { left: 25%; }
  body.sbs-ui-split #messageMirror { display: block; }

  .tb-group {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
  }
  .tb-group > label { font-size: 11px; opacity: .75; white-space: nowrap; }

  button, input[type=file], input[type=text], input[type=range] {
    font-family: inherit; font-size: 12px; color: #eee;
    background: #1f1f1f; border: 1px solid #444;
    border-radius: 4px; padding: 4px 8px;
    cursor: pointer; line-height: 1.2;
  }
  button:hover:not(:disabled) { background: #2c2c2c; border-color: #666; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.active { background: #0a6; border-color: #0c8; color: #fff; }
  input[type=text] { width: 64px; font-family: monospace; color: #7f7; background: #111; }
  input[type=range] { padding: 0; height: 18px; width: 90px; background: transparent; border: none; cursor: pointer; }
  input[type=file] { padding: 3px 6px; max-width: 150px; }

  #glassesInfo { font-size: 11px; opacity: .85; white-space: nowrap; }
  #glassesInfo.warn { color: #fa0; opacity: 1; }

  #message {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.65);
    padding: 6px 14px; border-radius: 6px;
    font-size: 12px; z-index: 50; white-space: nowrap;
  }

  #portraitScreen {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #fff; background: #000; z-index: 1000;
    font-size: 20px; text-align: center; line-height: 1.6;
  }
  @media (max-aspect-ratio: 1/1) { #portraitScreen { display: flex; } }

  #video {
    position: fixed; bottom: 16px; right: 16px;
    width: 18vw; max-width: 260px;
    border-radius: 6px; display: none;
  }
</style>
</head>
<body>

<div id="camView">
  <div id="toolbar">
    <div class="tb-group">
      <label>Video</label>
      <input type="file" accept="video/*" id="fileInput" />
    </div>

    <div class="tb-group">
      <label>FOV</label>
      <input type="range" id="zoomSlider" min="30" max="120" value="75" />
      <label>Split</label>
      <input type="range" id="splitSlider" min="0.4" max="0.6" step="0.01" value="0.5" />
      <label>Proj</label>
      <input type="range" id="projSlider" min="0" max="360" step="1" value="180" title="0=平面 / 180=半球(默认) / 360=整球" />
      <span id="projValue">180°</span>
      <button id="centerBtn">⊙ Center</button>
      <button id="resetBtn">↺ Reset</button>
    </div>

    <div class="tb-group">
      <label>View</label>
      <button id="viewBoth" class="active">👓 Both</button>
      <button id="viewLeft">👁 Left</button>
      <button id="viewRight">👁 Right</button>
    </div>

    <div class="tb-group">
      <label>Source</label>
      <button id="modePhoneBtn">📱 Phone</button>
      <button id="modeHidBtn" class="active">🕶 HID</button>
    </div>

    <div class="tb-group">
      <input type="text" id="vid" placeholder="VID" />
      <input type="text" id="pid" placeholder="PID" />
      <button id="connectHid">Connect</button>
      <button id="disconnectHid" disabled>Disconnect</button>
    </div>

    <div class="tb-group">
      <label>Glasses</label>
      <button id="glasses3dBtn" disabled title="发送 66 06 00">🎬 3D</button>
      <button id="glassesNormalBtn" disabled title="发送 66 07 00">📺 Normal</button>
      <span id="glassesInfo"></span>
    </div>

    <div class="tb-group">
      <button id="fullscreenBtn">⛶ Fullscreen</button>
    </div>
  </div>

  <div id="toolbarMirror"></div>
  <div id="message">Loading…</div>
  <div id="messageMirror"></div>
  <video id="video" playsinline muted controls crossorigin="anonymous"></video>
</div>

<div id="portraitScreen">
  📱 → 🖥️<br>
  Please rotate your device to landscape
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   1. 全局状态
   ============================================================ */
let renderer, sceneL, sceneR, cameraL, cameraR, texture;

const video          = document.getElementById("video");
const zoomSlider     = document.getElementById("zoomSlider");
const splitSlider    = document.getElementById("splitSlider");
const projSlider     = document.getElementById("projSlider");
const projValue      = document.getElementById("projValue");
const message        = document.getElementById("message");
const fullscreenBtn  = document.getElementById("fullscreenBtn");
const centerBtn      = document.getElementById("centerBtn");
const resetBtn       = document.getElementById("resetBtn");
const camView        = document.getElementById("camView");
const toolbar        = document.getElementById("toolbar");
const modePhoneBtn   = document.getElementById("modePhoneBtn");
const modeHidBtn     = document.getElementById("modeHidBtn");
const viewBothBtn    = document.getElementById("viewBoth");
const viewLeftBtn    = document.getElementById("viewLeft");
const viewRightBtn   = document.getElementById("viewRight");

let targetYaw = 0, targetPitch = 0;
let cameraYaw = 0, cameraPitch = 0;
let splitRatio = 0.5;
const DEFAULT_FOV = 75;
const DEFAULT_SPLIT = 0.5;
const DEFAULT_PROJECTION = 180;   // 0=纯平面，180=半球（原来的效果），360=整球
let projectionAngle = DEFAULT_PROJECTION;

/* ---- 调试开关（方向不对时只需改这里）---- */
const SWAP_EYES      = false; // 片源本身是"右眼在左半边"(交叉眼)时改为 true
const HID_YAW_SIGN   = -1;    // 头往右转、画面却往右跑 → 改成 1
const HID_PITCH_SIGN = 1;     // 抬头、画面却往上跑   → 改成 -1

let displayMode = 'both';        // 'both' | 'left' | 'right'
let orientationMode = 'hid';     // 默认 HID（你要的场景）

/* ---- HID 状态 ---- */
let hidDevice = null;
let pitchDeg = 0, yawDeg = 0, rollDeg = 0;
let lastSampleTime = null;
let hidYawOffset = 0, hidPitchOffset = 0;

/* ---- 手机状态（保留，不参与 HID 计算） ---- */
let headingOffset = null;
let pitchBase = null;
let lastHeading = 0;
let lastRawBeta = 0;
let phoneOrientationActive = false;

let uiVisible = true;      // 点击主画面切换：工具栏 / 原生播放器 / 提示文字
let videoLoaded = false;   // 还没载入视频时不显示原生播放器

/* ============================================================
   2. Quaternion 工具类
   ============================================================ */
class Quaternion {
  constructor(w = 1, x = 0, y = 0, z = 0) { this.w = w; this.x = x; this.y = y; this.z = z; }

  static fromEuler(alpha, beta, gamma) {
    const a = alpha * Math.PI / 180 / 2;
    const b = beta  * Math.PI / 180 / 2;
    const g = gamma * Math.PI / 180 / 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const cb = Math.cos(b), sb = Math.sin(b);
    const cg = Math.cos(g), sg = Math.sin(g);
    return new Quaternion(
      ca*cb*cg + sa*sb*sg,
      sa*cb*cg - ca*sb*sg,
      ca*sb*cg + sa*cb*sg,
      ca*cb*sg - sa*sb*cg
    );
  }

  toEuler() {
    const { w, x, y, z } = this;
    let alpha = Math.atan2(2*(w*z + x*y), 1 - 2*(y*y + z*z)) * 180/Math.PI;
    const sinBeta = 2*(w*y - z*x);
    let beta = Math.abs(sinBeta) >= 1 ? Math.sign(sinBeta)*90 : Math.asin(sinBeta)*180/Math.PI;
    let gamma = Math.atan2(2*(w*x + y*z), 1 - 2*(x*x + y*y)) * 180/Math.PI;
    return { alpha: this.norm(alpha), beta: this.norm(beta), gamma: this.norm(gamma) };
  }

  norm(a) { while (a > 180) a -= 360; while (a < -180) a += 360; return a; }

  slerp(o, t) {
    let dot = this.w*o.w + this.x*o.x + this.y*o.y + this.z*o.z;
    if (dot < 0) { o = new Quaternion(-o.w, -o.x, -o.y, -o.z); dot = -dot; }
    if (dot > 0.9995) {
      return new Quaternion(
        this.w + t*(o.w - this.w),
        this.x + t*(o.x - this.x),
        this.y + t*(o.y - this.y),
        this.z + t*(o.z - this.z)
      ).normalize();
    }
    const th0 = Math.acos(Math.abs(dot)), th = th0*t;
    const st = Math.sin(th), st0 = Math.sin(th0);
    const s0 = Math.cos(th) - dot*st/st0, s1 = st/st0;
    return new Quaternion(
      s0*this.w + s1*o.w,
      s0*this.x + s1*o.x,
      s0*this.y + s1*o.y,
      s0*this.z + s1*o.z
    );
  }

  normalize() {
    const l = Math.hypot(this.w, this.x, this.y, this.z);
    return l === 0 ? new Quaternion(1, 0, 0, 0)
                   : new Quaternion(this.w/l, this.x/l, this.y/l, this.z/l);
  }
}

class QuaternionSmoother {
  constructor(f = 0.1) {
    this.smoothFactor = f;
    this.currentQuaternion = new Quaternion(1, 0, 0, 0);
  }
  smoothOrientation(alpha, beta, gamma, aO = 0, bO = 0, gO = 0) {
    const nq = Quaternion.fromEuler(alpha + aO, beta + bO, gamma + gO);
    this.currentQuaternion = this.currentQuaternion.slerp(nq, this.smoothFactor);
    const e = this.currentQuaternion.toEuler();
    return [e.alpha, e.beta, e.gamma];
  }
  reset() { this.currentQuaternion = new Quaternion(1, 0, 0, 0); }
}

const smoother = new QuaternionSmoother(0.1);

function wrapAngle(a, min, max) {
  const r = max - min;
  while (a < min) a += r;
  while (a >= max) a -= r;
  return a;
}

/* ============================================================
   3. 初始化
   ============================================================ */
function init() {
  // 抗锯齿默认关闭：双眼各渲染一遍，MSAA 开销直接翻倍，
  // 而视频画面没有硬边缘，抗锯齿带来的观感提升很小，对大视频不划算。
  // 如果更在意画质、机器又跑得动，可以手动改回 true。
  renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setScissorTest(true);
  camView.appendChild(renderer.domElement);

  sceneL = new THREE.Scene();
  sceneR = new THREE.Scene();

  const aspect = (window.innerWidth / 2) / window.innerHeight;
  cameraL = new THREE.PerspectiveCamera(DEFAULT_FOV, aspect, 0.1, 2000);
  cameraR = new THREE.PerspectiveCamera(DEFAULT_FOV, aspect, 0.1, 2000);

  createDefaultTexture();

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    video.src = URL.createObjectURL(file);
    video.load();
    video.onloadeddata = () => {
      texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      // 不强制 RGBFormat：video 解码出来天然是 RGBA，强制转 RGB 等于每帧多一次格式转换，
      // 分辨率越高这笔开销越明显，去掉后交给 three.js 用默认（RGBA）格式。
      texture.generateMipmaps = false;
      texture.flipY = true;
      attachVideoFrameCallback(video);   // 按视频真实帧率上传纹理，见下方函数说明
      buildScene(texture);
      videoLoaded = true;
      applyUiVisibility();
      message.innerText = "Video loaded — press play";
      centerView();
    };
  });

  zoomSlider.addEventListener("input", () => {
    const fov = parseFloat(zoomSlider.value);
    cameraL.fov = cameraR.fov = fov;
    cameraL.updateProjectionMatrix();
    cameraR.updateProjectionMatrix();
  });
  splitSlider.addEventListener("input", () => {
    splitRatio = parseFloat(splitSlider.value);
  });
  projSlider.addEventListener("input", () => {
    projectionAngle = parseFloat(projSlider.value);
    projValue.textContent = projectionAngle.toFixed(0) + "°";
    if (texture) buildScene(texture);   // 实时重建投影几何体
  });

  centerBtn.onclick = centerView;
  resetBtn.onclick  = resetAll;

  fullscreenBtn.onclick = toggleFullscreen;
  ["fullscreenchange","webkitfullscreenchange","mozfullscreenchange","MSFullscreenChange"]
    .forEach(ev => document.addEventListener(ev, updateFullscreenButton));

  viewBothBtn.onclick  = () => setDisplayMode('both');
  viewLeftBtn.onclick  = () => setDisplayMode('left');
  viewRightBtn.onclick = () => setDisplayMode('right');

  modePhoneBtn.onclick = () => switchMode('phone');
  modeHidBtn.onclick   = () => switchMode('hid');

  document.getElementById('connectHid').onclick    = connectHid;
  document.getElementById('disconnectHid').onclick = disconnectHid;
  document.getElementById('glasses3dBtn').onclick     = () => setGlassesMode('3d');
  document.getElementById('glassesNormalBtn').onclick = () => setGlassesMode('normal');
  window.addEventListener('resize', updateGlassesUI);   // 换分辨率/挪窗口后刷新屏幕尺寸提示

  bindUiToggle();

  // 默认 HID 模式
  switchMode('hid');
}

/* ============================================================
   4. 显示模式
   ============================================================ */
function setDisplayMode(mode) {
  displayMode = mode;
  viewBothBtn.classList.toggle('active',  mode === 'both');
  viewLeftBtn.classList.toggle('active',  mode === 'left');
  viewRightBtn.classList.toggle('active', mode === 'right');
  updateCameraAspect();
  message.innerText = "View: " + mode.toUpperCase();
}

function updateCameraAspect() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = (displayMode === 'both') ? (w / 2) / h : w / h;
  cameraL.aspect = cameraR.aspect = aspect;
  cameraL.updateProjectionMatrix();
  cameraR.updateProjectionMatrix();
}

/* ============================================================
   5. Center / Reset / Fullscreen
   ============================================================ */
function centerView() {
  if (orientationMode === 'hid') {
    // HID：把"当前朝向"记为新的正前方。
    // 用偏移量而不是把 yawDeg/pitchDeg 清零——pitch 有重力互补滤波，
    // 清零后会被慢慢拉回重力角度，导致居中后画面上下漂移。
    hidYawOffset   = yawDeg;
    hidPitchOffset = pitchDeg;
  } else {
    headingOffset = lastHeading;
    pitchBase     = lastRawBeta;
  }
  targetYaw = 0; targetPitch = 0;
  cameraYaw = 0; cameraPitch = 0;
  smoother.reset();
  message.innerText = "View centered";
}

function resetAll() {
  zoomSlider.value = DEFAULT_FOV;
  cameraL.fov = cameraR.fov = DEFAULT_FOV;
  cameraL.updateProjectionMatrix();
  cameraR.updateProjectionMatrix();

  splitSlider.value = DEFAULT_SPLIT;
  splitRatio = DEFAULT_SPLIT;

  projSlider.value = DEFAULT_PROJECTION;
  projectionAngle = DEFAULT_PROJECTION;
  projValue.textContent = DEFAULT_PROJECTION + "°";
  if (texture) buildScene(texture);

  setDisplayMode('both');

  hidYawOffset   = yawDeg;
  hidPitchOffset = pitchDeg;

  headingOffset = null; pitchBase = null;
  smoother.reset();

  targetYaw = 0; targetPitch = 0;
  cameraYaw = 0; cameraPitch = 0;

  message.innerText = "Reset";
}

function toggleFullscreen() {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement ||
               document.mozFullScreenElement || document.msFullscreenElement;
  if (!isFs) {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen ||
     el.mozRequestFullScreen || el.msRequestFullscreen).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen ||
     document.mozCancelFullScreen || document.msExitFullscreen).call(document);
  }
}
function updateFullscreenButton() {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement ||
               document.mozFullScreenElement || document.msFullscreenElement;
  fullscreenBtn.textContent = isFs ? "⛶ Exit" : "⛶ Fullscreen";
}

/* ============================================================
   6. 模式切换
   ============================================================ */
function switchMode(mode) {
  if (mode === 'hid') {
    if (!hidDevice) { message.innerText = "Connect a HID device first"; return; }
    stopPhoneOrientation();
    orientationMode = 'hid';
    modeHidBtn.classList.add('active');
    modePhoneBtn.classList.remove('active');
    yawDeg = pitchDeg = rollDeg = 0;
    hidYawOffset = 0; hidPitchOffset = 0;
    lastSampleTime = null;
    smoother.reset();
    message.innerText = "Source: HID glasses";
  } else {
    startPhoneOrientation();
    orientationMode = 'phone';
    modePhoneBtn.classList.add('active');
    modeHidBtn.classList.remove('active');
    headingOffset = null; pitchBase = null;
    smoother.reset();
    message.innerText = "Source: Phone sensor";
  }
}

/* ============================================================
   7. 手机传感器（保留，不参与 HID 计算）
   ============================================================ */
function startPhoneOrientation() {
  if (phoneOrientationActive) return;

  const attach = () => {
    window.addEventListener("deviceorientation", handleOrientation, true);
    phoneOrientationActive = true;
  };

  if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => {
      if (r === 'granted') attach();
      else message.innerText = "Phone sensor permission denied";
    }).catch(err => { message.innerText = "Permission error: " + err; });
  } else {
    attach();
  }
}
function stopPhoneOrientation() {
  window.removeEventListener("deviceorientation", handleOrientation, true);
  phoneOrientationActive = false;
}

/* 手机姿态 → 相机 yaw/pitch
   取"手机背面(-Z 轴)朝向的方向向量"，再换算成 yaw/pitch。
   这个方向与屏幕是横屏还是竖屏无关，所以横屏(左/右)、竖屏都正确。
   W3C 姿态矩阵 R = Rz(α)·Rx(β)·Ry(γ)，背面方向 = R·(0,0,-1)，
   坐标 E=东 N=北 U=上：
     yaw   = atan2(E, N)   （向右转为正，与 HID/相机约定一致）
     pitch = asin(U)       （向上看为正） */
function handleOrientation(event) {
  if (orientationMode !== 'phone') return;
  if (event.alpha === null || event.beta === null || event.gamma === null) return;

  const D = Math.PI / 180;
  const a = (event.alpha || 0) * D;
  const b = (event.beta  || 0) * D;
  const g = (event.gamma || 0) * D;
  const sa = Math.sin(a), ca = Math.cos(a);
  const sb = Math.sin(b), cb = Math.cos(b);
  const sg = Math.sin(g), cg = Math.cos(g);

  const E = -(cg * sa * sb + ca * sg);
  const N =   ca * cg * sb - sa * sg;
  const U = -(cb * cg);

  const yaw   = Math.atan2(E, N) / D;
  const pitch = Math.asin(THREE.MathUtils.clamp(U, -1, 1)) / D;

  applyPhoneOrientation(yaw, pitch);
}

// headingOffset / pitchBase：Center 时记下的"正前方"，首帧自动取当前朝向
function applyPhoneOrientation(yaw, pitch) {
  if (yaw == null || pitch == null || isNaN(yaw) || isNaN(pitch)) return;

  lastHeading = yaw;     // 供 Center 使用
  lastRawBeta = pitch;

  if (headingOffset === null) headingOffset = yaw;
  if (pitchBase === null)     pitchBase     = pitch;

  // yaw 归一到 ±180 后，再与上一帧"展开"，避免跨 ±180° 时画面倒着转一整圈
  const relYaw = wrapAngle(yaw - headingOffset, -180, 180);
  const d = wrapAngle(relYaw - targetYaw, -180, 180);

  targetYaw   = targetYaw + d;
  targetPitch = THREE.MathUtils.clamp(pitch - pitchBase, -90, 90);

  message.innerText = `[Phone] Yaw ${targetYaw.toFixed(1)}° / Pitch ${targetPitch.toFixed(1)}°`;
}

/* ============================================================
   7.5 3D 模式下的工具栏/提示镜像
   目的：眼镜 3D（SBS）模式下，左右眼分别只能看到屏幕的左半/右半。
   工具栏原本横跨全屏，会被从中间切开，两只眼看到的是"同一份的两半"而不是
   "各自完整的一份"，没法融合。这里在右半屏放一份纯展示的镜像（不可点击，
   所有操作仍在左边真正的工具栏上进行），左右内容一致，方便透过眼镜重叠。
   ============================================================ */
const toolbarMirror = document.getElementById('toolbarMirror');
const messageMirror  = document.getElementById('messageMirror');

function syncToolbarMirror() { toolbarMirror.innerHTML = toolbar.innerHTML; }
function syncMessageMirror()  { messageMirror.textContent = message.textContent; }

new MutationObserver(syncToolbarMirror)
  .observe(toolbar, { childList: true, subtree: true, attributes: true, characterData: true });
new MutationObserver(syncMessageMirror)
  .observe(message, { childList: true, subtree: true, characterData: true });

function setSbsUiSplit(active) {
  document.body.classList.toggle('sbs-ui-split', active);
  if (active) { syncToolbarMirror(); syncMessageMirror(); }
}

/* ============================================================
   8. HID
   ============================================================ */
/* ---- 眼镜命令表：按 vendorId/productId 识别型号，各自一套命令 ----
   目前只有 RayNeo Air 2 的协议是抓包/用户验证过的。以后拿到别的型号的抓包，
   照着这个格式加一条 profile 即可，不用改别处逻辑。
   命令格式统一是 sendReport(reportId, bytes)；RayNeo 是 reportId=0、3 字节、不补零。 */
const GLASSES_PROFILES = [
  {
    id: 'rayneo_air2',
    label: 'RayNeo Air 2',
    match: (d) => d.vendorId === 0x1bbb && d.productId === 0xaf50,
    reportId: 0,
    cmd: {
      enableInput: [0x66, 0x01, 0x00],   // 已确认：开启 HID 输入（IMU 数据流）
      mode3d:      [0x66, 0x06, 0x00],   // 3D（左右分屏 SBS）—— 用户报告，未独立验证
      modeNormal:  [0x66, 0x07, 0x00],   // 正常模式 —— 用户报告，未独立验证
      stop:        null,                  // 停止 HID 输出的命令还没找到；找到后填在这里
    },
  },
  // { id: 'xxx', label: '型号名', match: d => d.vendorId===0x.... && d.productId===0x....,
  //   reportId: 0, cmd: { enableInput:[...], mode3d:[...], modeNormal:[...], stop:[...] } },
];

let activeProfile = null;   // 连接时按 vendorId/productId 匹配出来的 profile；未识别型号为 null
let glassesMode = null;     // '3d' | 'normal' | null（本页还没发过模式命令，眼镜实际状态未知）

function detectGlassesProfile(device) {
  return GLASSES_PROFILES.find(p => {
    try { return p.match(device); } catch (e) { return false; }
  }) || null;
}

async function sendGlassesCommand(bytes) {
  if (!hidDevice || !hidDevice.opened || !bytes) return false;
  try {
    await hidDevice.sendReport((activeProfile ? activeProfile.reportId : 0), Uint8Array.from(bytes));
    return true;
  } catch (err) {
    console.error(err);
    message.innerText = 'Glasses command failed: ' + err.message;
    return false;
  }
}

async function setGlassesMode(mode) {
  if (!activeProfile) return;   // 未识别型号：不知道命令是什么，按钮本来也是禁用的
  const ok = await sendGlassesCommand(mode === '3d' ? activeProfile.cmd.mode3d : activeProfile.cmd.modeNormal);
  if (!ok) return;
  glassesMode = mode;
  updateGlassesUI();
  setSbsUiSplit(mode === '3d');   // 进 3D 复制一份工具栏；退回 Normal 恢复单份
}

function updateGlassesUI() {
  const connected = !!hidDevice;
  const b3 = document.getElementById('glasses3dBtn');
  const bn = document.getElementById('glassesNormalBtn');
  const info = document.getElementById('glassesInfo');
  const known = connected && !!activeProfile;
  b3.disabled = bn.disabled = !known;
  b3.classList.toggle('active', known && glassesMode === '3d');
  bn.classList.toggle('active', known && glassesMode === 'normal');
  if (!connected) { info.textContent = ''; info.className = ''; return; }

  if (!activeProfile) {
    info.textContent = `⚠ 未识别的型号(VID:0x${(hidDevice.vendorId||0).toString(16)} PID:0x${(hidDevice.productId||0).toString(16)})，未自动发送任何命令`;
    info.className = 'warn';
    return;
  }

  // 屏幕物理像素：3D(SBS) 一般需要电脑输出 3840×1080，这个页面没法替你改系统分辨率
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(screen.width * dpr), h = Math.round(screen.height * dpr);
  const ok3d = (w === 3840 && h === 1080);
  info.textContent = `${activeProfile.label} · 屏幕 ${w}×${h}` +
    (glassesMode === '3d' ? (ok3d ? ' ✓' : ' ⚠ 3D 一般需要 3840×1080') : '');
  info.className = (glassesMode === '3d' && !ok3d) ? 'warn' : '';
}

async function connectHid() {
  if (!('hid' in navigator)) {
    alert('WebHID not supported. Use desktop Chrome/Edge over https:// or http://localhost.');
    return;
  }
  const vidStr = document.getElementById('vid').value.trim();
  const pidStr = document.getElementById('pid').value.trim();
  const filters = [];
  if (vidStr) {
    const f = { vendorId: parseInt(vidStr, 16) };
    if (pidStr) f.productId = parseInt(pidStr, 16);
    filters.push(f);
  }

  try {
    const devices = await navigator.hid.requestDevice({ filters });
    if (!devices.length) { message.innerText = "No device selected"; return; }
    hidDevice = devices[0];
    if (!hidDevice.opened) await hidDevice.open();
    hidDevice.addEventListener('inputreport', handleHidInputReport);

    document.getElementById('connectHid').disabled = true;
    document.getElementById('disconnectHid').disabled = false;

    yawDeg = pitchDeg = rollDeg = 0;
    hidYawOffset = 0; hidPitchOffset = 0;
    lastSampleTime = null;

    switchMode('hid');

    // 按 vendorId/productId 识别型号，只有识别出来的型号才会自动发命令
    activeProfile = detectGlassesProfile(hidDevice);
    glassesMode = null;
    updateGlassesUI();
    if (activeProfile) {
      // 不 await：sendReport 偶尔较慢，别卡住画面
      sendGlassesCommand(activeProfile.cmd.enableInput);
    }
  } catch (err) {
    console.error(err);
    message.innerText = "HID connect failed: " + err.message;
  }
}

async function disconnectHid() {
  const stopCmd = activeProfile ? activeProfile.cmd.stop : null;
  if (hidDevice) {
    if (stopCmd) await sendGlassesCommand(stopCmd);   // 停止命令（该型号已知时才发；见上方 profile 表）
    hidDevice.removeEventListener('inputreport', handleHidInputReport);
    try { await hidDevice.close(); } catch (e) {}
    hidDevice = null;
  }
  activeProfile = null;
  glassesMode = null;
  updateGlassesUI();
  setSbsUiSplit(false);   // 断开时保险起见恢复单份工具栏
  document.getElementById('connectHid').disabled = false;
  document.getElementById('disconnectHid').disabled = true;
  switchMode('phone');
  if (!stopCmd) message.innerText = 'HID closed — glasses keep streaming IMU until USB is replugged';
}

function parseReport(bytes) {
  if (bytes.length < 48) return null;
  // RayNeo：IMU 帧头 99 65；99 开头但类型不是 65 的是命令应答/状态帧（如 99 C8 设备信息），不能当 IMU 解析
  if (bytes[0] === 0x99 && bytes[1] !== 0x65) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  return {
    ax: dv.getFloat32(4, true),
    ay: dv.getFloat32(8, true),
    az: dv.getFloat32(12, true),
    gx: dv.getFloat32(16, true),
    gy: dv.getFloat32(20, true),
    gz: dv.getFloat32(24, true),
  };
}

function handleHidInputReport(event) {
  if (orientationMode !== 'hid') return;
  const bytes = new Uint8Array(event.data.buffer);
  const p = parseReport(bytes);
  if (!p) return;

  updatePose(p.ax, p.ay, p.az, p.gx, p.gy, p.gz);
  applyHidOrientation(yawDeg, pitchDeg);
}

function updatePose(ax, ay, az, gx, gy, gz) {
  const now = performance.now();
  let dt = lastSampleTime === null ? 0 : (now - lastSampleTime) / 1000;
  lastSampleTime = now;
  dt = Math.min(dt, 0.5);

  pitchDeg += gx * dt;
  yawDeg   += gy * dt;
  rollDeg  += gz * dt;

  const accMag = Math.sqrt(ax*ax + ay*ay + az*az);
  if (accMag > 7 && accMag < 12) {
    const rollAcc  = Math.atan2(ax, ay) * 180 / Math.PI;
    const pitchAcc = Math.atan2(-az, ay) * 180 / Math.PI;
    const alpha = 0.02;
    rollDeg  = rollDeg  * (1 - alpha) + rollAcc  * alpha;
    pitchDeg = pitchDeg * (1 - alpha) + pitchAcc * alpha;
  }
}

/* HID 映射：传感器角度 → 相机角度
   相机约定：targetYaw 正 = 向右看，targetPitch 正 = 向上看
   方向不对请改文件顶部的 HID_YAW_SIGN / HID_PITCH_SIGN */
function applyHidOrientation(rawYaw, rawPitch) {
  const relYaw   = rawYaw   - hidYawOffset;
  const relPitch = rawPitch - hidPitchOffset;

  targetYaw   = THREE.MathUtils.clamp(HID_YAW_SIGN   * relYaw,   -180, 180);
  targetPitch = THREE.MathUtils.clamp(HID_PITCH_SIGN * relPitch,  -90,  90);

  message.innerText = `[HID] Yaw ${targetYaw.toFixed(1)}° / Pitch ${targetPitch.toFixed(1)}°`;
}

/* ============================================================
   9. 点击主画面：显示 / 隐藏 UI（工具栏、原生播放器、提示文字）
   ============================================================ */
function applyUiVisibility() {
  toolbar.style.display = uiVisible ? 'flex' : 'none';
  video.style.display   = (uiVisible && videoLoaded) ? 'block' : 'none';
  message.style.display = uiVisible ? 'block' : 'none';
  // 镜像跟随隐藏；显示时是否可见仍由 sbs-ui-split（是否 3D）决定，交给 CSS 处理
  toolbarMirror.style.display = uiVisible ? '' : 'none';
  messageMirror.style.display = uiVisible ? '' : 'none';
}

function bindUiToggle() {
  // 只监听 three 的 canvas：点工具栏 / 原生播放器本身不会触发切换
  renderer.domElement.addEventListener('click', () => {
    uiVisible = !uiVisible;
    applyUiVisibility();
  });
  // 右键 = 重新居中（等价于点 Center 按钮），并阻止浏览器自带的右键菜单弹出
  renderer.domElement.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    centerView();
  });
}

/* ============================================================
   10. 默认纹理
   ============================================================ */
function createDefaultTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  gradient.addColorStop(0, '#1e3c72');
  gradient.addColorStop(1, '#2a5298');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = 2;
  const gridSize = 64;
  for (let x = 0; x <= canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();

  ctx.fillStyle = 'white';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 96px Arial';
  ctx.fillText('LEFT',  canvas.width / 4,     canvas.height / 2);
  ctx.fillText('RIGHT', (canvas.width / 4) * 3, canvas.height / 2);

  // UP / DOWN 分别画在左右两半的中线上，每只眼都能完整看到
  ctx.font = 'bold 72px Arial';
  ctx.fillStyle = '#ffd24a';
  for (const cx of [canvas.width / 4, (canvas.width / 4) * 3]) {
    ctx.fillText('UP',   cx, 120);
    ctx.fillText('DOWN', cx, canvas.height - 120);
  }

  texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;
  texture.flipY = true;
  texture.needsUpdate = true;

  buildScene(texture);
  message.innerText = "Default test scene loaded";
}

/* ============================================================
   11. 场景构建
   半球面 + BackSide，半球正中心对准相机默认朝向(-Z)
   ------------------------------------------------------------
   SphereGeometry 顶点：x = -cos(phi)·sinθ, z = sin(phi)·sinθ
   phi 取 [π, 2π]：u=0 → +X(右)，u=0.5 → -Z(正前方)，u=1 → -X(左)
   从球内往外看，u 增大的方向是向左，所以取 1-u 抵消镜像。
   左眼取纹理左半 [0, 0.5]，右眼取纹理右半 [0.5, 1]。

   投影形状（projectionAngle，0°~360°，默认 180°）：
   - 180°：跟原来完全一样的半球，不做任何改动。
   - 180°~360°：水平方向的包裹角度真的从 180° 撑大到 360°（整球），
     垂直方向的 180° 顶到底不变——这是标准的"180 视频铺到整球"效果。
   - 0°~180°：按每个顶点在"纯平面"和"180° 半球"之间线性插值，180° 时
     权重 100% 落在半球公式上，跟原来的效果逐字节一致；越往 0° 拉，
     画面越接近一块立在正前方的平面。内容用的还是半球自身生成的 uv
     反推平面位置，所以不会因为这个插值而采样错位。
   ============================================================ */
function buildProjectionGeometry(angleDeg) {
  const R = 500;
  const a = THREE.MathUtils.clamp(angleDeg, 0, 360);

  if (a >= 180) {
    // 180°→360°：垂直始终是完整的 π（顶到底），水平角度线性撑大到整球
    const phiLength = THREE.MathUtils.degToRad(a);
    const phiStart  = 1.5 * Math.PI - phiLength / 2;   // 内容中心始终对着 -Z（正前方）
    return new THREE.SphereGeometry(R, 64, 32, phiStart, phiLength, 0, Math.PI);
  }

  // 0°→180°：在"纯平面"与"180° 半球"之间做逐顶点插值
  const geo = new THREE.SphereGeometry(R, 64, 32, Math.PI, Math.PI, 0, Math.PI); // 半球，跟原版一模一样
  const t = a / 180;   // 0 = 纯平面，1 = 半球（等于原版效果）
  const pos = geo.attributes.position;
  const uv  = geo.attributes.uv;   // 半球自身生成的 uv（还没做左右眼重映射），用它反推平面位置
  const HALF_W = 500, HALF_H = 500, FLAT_Z = -500;   // 纯平面时的宽/高/距离，量级与半球(R=500)一致
  for (let i = 0; i < pos.count; i++) {
    const u = uv.getX(i), v = uv.getY(i);
    // 注意：这两行的符号是照着半球自身在 u/v 端点处的真实 x/y 数值反推出来的，
    // 不是随手写的对称公式——直接写 (u-0.5) 之类直觉上"对称"的式子，符号会刚好反过来，
    // 插值中途所有顶点会先收缩过原点再展开，画面会自相交出蝴蝶结状的花纹。
    const flatX = (0.5 - u) * 2 * HALF_W;
    const flatY = (v - 0.5) * 2 * HALF_H;
    const sx = pos.getX(i), sy = pos.getY(i), sz = pos.getZ(i);
    pos.setXYZ(i,
      flatX + (sx - flatX) * t,
      flatY + (sy - flatY) * t,
      FLAT_Z + (sz - FLAT_Z) * t
    );
  }
  pos.needsUpdate = true;
  return geo;
}

function buildScene(texture) {
  while (sceneL.children.length) sceneL.remove(sceneL.children[0]);
  while (sceneR.children.length) sceneR.remove(sceneR.children[0]);

  const geometry = buildProjectionGeometry(projectionAngle);

  const geoL = geometry.clone();
  const geoR = geometry.clone();
  const uvL = geoL.attributes.uv;
  const uvR = geoR.attributes.uv;

  const leftHalf  = SWAP_EYES ? 0.5 : 0.0;   // 左眼使用的纹理起点
  const rightHalf = SWAP_EYES ? 0.0 : 0.5;   // 右眼使用的纹理起点

  for (let i = 0; i < uvL.count; i++) {
    uvL.setX(i, leftHalf  + (1 - uvL.getX(i)) * 0.5);
  }
  for (let i = 0; i < uvR.count; i++) {
    uvR.setX(i, rightHalf + (1 - uvR.getX(i)) * 0.5);
  }

  const matL = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
  const matR = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });

  sceneL.add(new THREE.Mesh(geoL, matL));
  sceneR.add(new THREE.Mesh(geoR, matR));
}

/* ============================================================
   11.5 按视频真实帧率更新纹理（缓解大视频卡顿）
   ------------------------------------------------------------
   原来的写法是不管视频是 24fps 还是 60fps，只要浏览器刷新（可能 90Hz/120Hz），
   每次 rAF 都把 texture.needsUpdate 置 true，等于把同一帧反复传上 GPU，
   分辨率越大这笔重复上传的开销越明显，是大视频卡顿的一个常见原因。
   有 requestVideoFrameCallback 的浏览器（Chrome/Edge，以及较新版本的
   Safari/Firefox）会在真正解码出新一帧时才把 videoTextureNeedsUpdate 置 true；
   不支持的浏览器自动退回原来"每帧都传"的老逻辑，行为不会变差。
   ============================================================ */
let videoTextureNeedsUpdate = true;
let usingRVFC = false;

function attachVideoFrameCallback(vid) {
  usingRVFC = typeof vid.requestVideoFrameCallback === 'function';
  if (!usingRVFC) return;   // 不支持就什么都不做，animate() 里继续走老逻辑
  videoTextureNeedsUpdate = false;
  const onFrame = () => {
    videoTextureNeedsUpdate = true;
    vid.requestVideoFrameCallback(onFrame);
  };
  vid.requestVideoFrameCallback(onFrame);
}

/* ============================================================
   12. 渲染循环
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);

  cameraYaw   += (targetYaw   - cameraYaw)   * 0.1;
  cameraPitch += (targetPitch - cameraPitch) * 0.1;

  const yawRad   = THREE.MathUtils.degToRad(cameraYaw);
  const pitchRad = THREE.MathUtils.degToRad(cameraPitch);
  // yaw=0,pitch=0 时看向 -Z（three.js 相机默认朝向，也是半球的正中心）
  // yaw 正 = 向右(+X)，pitch 正 = 向上(+Y)
  const x =  Math.cos(pitchRad) * Math.sin(yawRad);
  const y =  Math.sin(pitchRad);
  const z = -Math.cos(pitchRad) * Math.cos(yawRad);
  const lookAt = new THREE.Vector3(x, y, z);

  cameraL.lookAt(lookAt);
  cameraR.lookAt(lookAt);

  if (texture && texture.isVideoTexture && videoTextureNeedsUpdate) {
    texture.needsUpdate = true;
    if (usingRVFC) videoTextureNeedsUpdate = false;   // 这一帧已经传过了，等下一次回调再传
  }

  const w = window.innerWidth, h = window.innerHeight;

  if (displayMode === 'both') {
    renderer.setViewport(0, 0, w/2, h);
    renderer.setScissor(0, 0, w*splitRatio, h);
    renderer.render(sceneL, cameraL);

    renderer.setViewport(w/2, 0, w/2, h);
    renderer.setScissor(w*splitRatio, 0, w*(1-splitRatio), h);
    renderer.render(sceneR, cameraR);

  } else if (displayMode === 'left') {
    renderer.setViewport(0, 0, w, h);
    renderer.setScissor(0, 0, w, h);
    renderer.render(sceneL, cameraL);

  } else {
    renderer.setViewport(0, 0, w, h);
    renderer.setScissor(0, 0, w, h);
    renderer.render(sceneR, cameraR);
  }
}

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  updateCameraAspect();
});

/* ============================================================
   13. 启动
   ============================================================ */
init();
animate();
</script>
